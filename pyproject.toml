[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karhutla-idc"
version = "0.1.0"
description = "Data pipeline for the IDC Dateraquest 2.0 Sumatra karhutla dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pandera>=0.20",
]

[project.optional-dependencies]
pipeline = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "rasterstats>=0.19",
    "xarray>=2024.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
